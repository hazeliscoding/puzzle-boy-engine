name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Atlus data and decompiler output never enter the repo. The test plants each kind and expects a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No game data
        run: |
          scripts/check-no-game-data.test.sh
          scripts/check-no-game-data.sh

  build:
    # The rules are headless and the shared libraries are cross-platform; both must behave the same on every system the games ship for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PuzzleBoy.Engine.slnx

      - name: Build
        run: dotnet build PuzzleBoy.Engine.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution PuzzleBoy.Engine.slnx --configuration Release --no-build

      - name: Format
        run: dotnet format PuzzleBoy.Engine.slnx --verify-no-changes --no-restore
